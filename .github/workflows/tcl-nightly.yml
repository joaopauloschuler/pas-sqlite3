# tcl-nightly.yml — task 9.4.5.a (CI nightly Tcl-suite, bare wiring).
#
# Nightly run of bin/TclTestDriver against the full MANIFEST.txt.
# The driver invoked with `--gate strict` (9.4.8.c) compares each
# test's outcome against src/tests/tcl/STATUS.txt and exits non-zero
# on any pas-strict regression — which fails this workflow.
#
# Scope of *this* ticket (9.4.5.a) is the bare nightly wiring only.
# Sharding (9.4.5.b) and failure-report artefact upload (9.4.5.c)
# are deliberately out of scope and will land in follow-up tickets.
#
# PR gate stays on the Phase 9.1 / 9.2 / 9.3.1 seed-set sweep; this
# workflow runs nightly only (cron) and on manual dispatch.
#
# Local reproduction:
#   src/tests/build.sh
#   src/tests/build_tcl_lib.sh
#   src/tests/build_tcl_driver.sh
#   bin/TclTestDriver --gate strict
#
# Pre-req: upstream sqlite3 source tree at ../sqlite3 relative to the
# checkout (see src/tests/build.sh).  The job clones the SQLite
# GitHub mirror into that location.
#
# Threading audit (9.4.7.i) hasn't landed; single Linux profile only.

name: tcl-nightly

on:
  schedule:
    # 04:17 UTC daily — low-traffic window for GitHub Actions, off
    # the top of the hour to avoid scheduler contention.
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  nightly:
    name: tcl-nightly (full MANIFEST, --gate strict)
    runs-on: ubuntu-latest
    # Reported full-sweep wall-time: ~5-6 min (334.8 s / 959 tests in
    # 9.4.4.g).  30 min budget gives ~5x headroom for CI variance.
    timeout-minutes: 30
    steps:
      - name: Checkout pas-sqlite3
        uses: actions/checkout@v4
        with:
          path: pas-sqlite3

      - name: Checkout upstream sqlite3 source tree
        uses: actions/checkout@v4
        with:
          repository: sqlite/sqlite
          path: sqlite3

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential fpc tcl8.6-dev libsqlite3-dev tcllib

      - name: Build pas-sqlite3
        working-directory: pas-sqlite3
        run: src/tests/build.sh

      - name: Build Tcl shared object
        working-directory: pas-sqlite3
        run: src/tests/build_tcl_lib.sh

      - name: Build TclTestDriver
        working-directory: pas-sqlite3
        run: src/tests/build_tcl_driver.sh

      - name: Run TclTestDriver (full MANIFEST, --gate strict)
        working-directory: pas-sqlite3
        # `--gate strict` (9.4.8.c) makes the driver exit non-zero on
        # any pas-strict regression vs STATUS.txt — which fails the
        # job per the task contract.
        run: bin/TclTestDriver --gate strict
